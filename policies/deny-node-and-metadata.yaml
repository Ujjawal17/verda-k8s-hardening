# Cluster-wide egress deny, independent of each namespace's own policies (defence in depth):
# - cloud metadata endpoint (credential theft path)
# - kubelet API on every node (10250)
# Exempt: kube-system (system components) and monitoring (Prometheus scrapes kubelet metrics).
# enableDefaultDeny=false: this policy only subtracts, it does not put every pod into default-deny.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-node-and-metadata
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [kube-system, monitoring]
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR: [169.254.169.254/32]
    - toEntities: [host, remote-node]
      toPorts:
        - ports: [{ port: "10250", protocol: TCP }]
