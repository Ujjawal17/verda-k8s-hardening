# Extra rules on top of PSS Restricted for every namespace that is NOT on the platform list.
# Secure by default: a new namespace gets these rules without anyone opting in.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: workload-hardening
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:   # label set by the API server itself, cannot be changed by users
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, argocd, kyverno, monitoring, falco,
                   trivy-system, sealed-secrets]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: "automountServiceAccountToken must be false (no API token in app pods)."
    - expression: >-
        variables.containers.all(c, has(c.securityContext) &&
          has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true)
      message: "Containers must set securityContext.readOnlyRootFilesystem: true."
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: "Containers must set cpu and memory limits."
    - expression: variables.containers.all(c, c.image.contains('@sha256:'))
      message: "Images must be pinned by digest (image@sha256:...)."
