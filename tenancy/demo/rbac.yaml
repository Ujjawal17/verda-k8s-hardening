# Team "tenant-demo" (an OIDC group in prod) gets tenant-developer rights in demo only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-developers
  namespace: demo
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-developer }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: tenant-demo }
