# gVisor sandbox for untrusted tenants. runsc is installed on workers only (bootstrap.sh);
# cp-1 is tainted, so tenant pods never land there.
# Trade-off: the host's Falco cannot see syscalls inside the sandbox (gVisor handles them itself).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
