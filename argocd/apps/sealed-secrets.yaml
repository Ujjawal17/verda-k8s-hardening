# Controller only. Its private key is NOT generated here: bootstrap.sh installs our own offline-generated
# key before the controller starts, so secrets can be sealed before the cluster exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        keyrenewperiod: "0"      # no auto-rotation: we own the key (rotation = docs/runbook)
        metrics:
          serviceMonitor: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
