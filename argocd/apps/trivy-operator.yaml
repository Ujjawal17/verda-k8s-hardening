apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.37.0
    helm:
      valuesObject:
        serviceMonitor: { enabled: true }
        operator:
          metricsVulnIdEnabled: true       # per-CVE metrics for the Grafana dashboard
          scanJobsConcurrentLimit: 3
        nodeCollector:
          tolerations: [{ operator: Exists }]   # also run the CIS node checks on cp-1
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged   # node-collector reads host files for CIS checks
