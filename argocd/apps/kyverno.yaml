apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/compare-options: ServerSideDiff=true   # diff like the API server applies (pairs with ServerSideApply)
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valuesObject:
        admissionController:
          replicas: 3            # HA: webhook is fail-closed, so an outage must not block the cluster
          serviceMonitor: { enabled: true }
        backgroundController:
          serviceMonitor: { enabled: true }
        reportsController:
          serviceMonitor: { enabled: true }
        cleanupController:
          serviceMonitor: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  # Chart renders "labels: {}" on CRDs; server-side apply drops empty maps -> permanent false drift.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers: [/metadata/labels]
