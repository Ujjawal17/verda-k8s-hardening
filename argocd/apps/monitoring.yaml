apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        valuesObject:
          crds: { enabled: false }               # installed by the prometheus-crds app
          # RKE2 binds these to localhost, scraping them only produces "target down" noise
          kubeEtcd: { enabled: false }
          kubeControllerManager: { enabled: false }
          kubeScheduler: { enabled: false }
          kubeProxy: { enabled: false }
          # Its scrape Service lives in kube-system, which the platform project may not write to.
          # DNS visibility comes from Hubble's dns metrics instead.
          coreDns: { enabled: false }
          prometheus:
            prometheusSpec:
              retention: 3d
              # pick up ServiceMonitors / PodMonitors / rules from every namespace
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              ruleSelectorNilUsesHelmValues: false
          prometheus-node-exporter:
            tolerations: [{ operator: Exists }]
          grafana:
            admin:
              existingSecret: grafana-admin        # SealedSecret in monitoring/
              userKey: admin-user
              passwordKey: admin-password
            dashboardProviders:
              dashboardproviders.yaml:
                apiVersion: 1
                providers:
                  - name: security
                    folder: Security
                    type: file
                    options: { path: /var/lib/grafana/dashboards/security }
            dashboards:
              security:
                trivy:  { gnetId: 17813, revision: 2, datasource: Prometheus }
                kyverno: { gnetId: 15987, revision: 2, datasource: Prometheus }
                hubble: { gnetId: 16613, revision: 1, datasource: Prometheus }
    # Our alert rules, security dashboard, PodMonitors for Cilium, sealed Grafana admin secret
    - repoURL: https://github.com/Ujjawal17/verda-k8s-hardening.git
      targetRevision: main
      path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged   # node-exporter needs host PID/net/path
