# Argo CD installed once by RKE2's helm-controller. Everything else is then deployed by Argo CD from Git.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.11.1
  targetNamespace: argocd
  valuesContent: |-
    dex:
      enabled: false             # no SSO; UI only via SSH tunnel
    notifications:
      enabled: false
    configs:
      cm:
        admin.enabled: "false"   # no admin login; all changes go through Git
        accounts.viewer: login   # read-only UI user, password set once via kubectl (README)
        # Report child Application health so sync waves in the app-of-apps wait for it
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil and obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then hs.message = obj.status.health.message end
          end
          return hs
      rbac:
        policy.default: role:readonly
